[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Hashed build assets never change; cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Figma-exported photos, logo layers and icons. Not hashed, so cache for a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

# Netlify's Next.js adapter. Declared explicitly (and pinned in web/package.json) because
# auto-detection didn't apply it: without it Netlify publishes the raw .next folder and
# every URL 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
